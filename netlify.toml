[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"

[build.environment]
VITE_GOLD_STREAM_URL = "https://folkradio-stream-proxy.ismail-ismailov.workers.dev/api/stream/gold"
VITE_NAZDRAVE_STREAM_URL = "https://folkradio-stream-proxy.ismail-ismailov.workers.dev/api/stream/nazdrave"

[[redirects]]
from = "/api/stream/nazdrave"
to = "/.netlify/functions/nazdrave-stream"
status = 200
force = true

[[redirects]]
from = "/api/stream/gold"
to = "/.netlify/functions/gold-stream"
status = 200
force = true

[[headers]]
for = "/api/stream/*"

[headers.values]
Access-Control-Allow-Origin = "*"

[[redirects]]
from = "/*"
to = "http://92.247.130.252:8066/"
status = 301
force = true
conditions = { Host = ["str1.folkradionazdrave.com"] }

[[redirects]]
from = "/*"
to = "http://78.83.177.106:8000/"
status = 301
force = true
conditions = { Host = ["str2.folkradionazdrave.com"] }

[[redirects]]
from = "/*"
to = "http://92.247.130.252:8020/"
status = 301
force = true
conditions = { Host = ["str3.folkradionazdrave.com"] }

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; connect-src 'self' https://live.folkradionazdrave.com https://stream.folkradionazdrave.com https://folkradio-stream-proxy.ismail-ismailov.workers.dev; media-src 'self' https://live.folkradionazdrave.com https://stream.folkradionazdrave.com https://folkradio-stream-proxy.ismail-ismailov.workers.dev blob:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/logo.png"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/icon-192.png"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/og-image.jpg"

[headers.values]
Cache-Control = "public, max-age=604800"
