[build]
command = "npm run build"
publish = "dist"

# Legacy Netlify hosting — prefer Cloudflare Pages (`npm run deploy:site`).
# Netlify Functions disabled so stream traffic cannot burn Netlify bandwidth.

[build.environment]
# Prefer same-origin Pages/_worker.js streams locally and on Cloudflare Pages.
# Optional override to the dedicated Worker:
# VITE_GOLD_STREAM_URL = "https://live.folkradionazdrave.com/api/stream/gold"
# VITE_NAZDRAVE_STREAM_URL = "https://live.folkradionazdrave.com/api/stream/nazdrave"

[[redirects]]
from = "/*"
to = "http://92.247.130.252:8066/"
status = 301
force = true
conditions = { Host = ["str1.folkradionazdrave.com"] }

[[redirects]]
from = "/*"
to = "http://78.83.177.106:8000/"
status = 301
force = true
conditions = { Host = ["str2.folkradionazdrave.com"] }

[[redirects]]
from = "/*"
to = "http://92.247.130.252:8020/"
status = 301
force = true
conditions = { Host = ["str3.folkradionazdrave.com"] }

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; connect-src 'self' https://live.folkradionazdrave.com https://stream.folkradionazdrave.com https://folkradio-stream-proxy.ismail-ismailov.workers.dev; media-src 'self' https://live.folkradionazdrave.com https://stream.folkradionazdrave.com https://folkradio-stream-proxy.ismail-ismailov.workers.dev blob:; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.png"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.jpg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
